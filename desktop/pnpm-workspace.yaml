# Its own pnpm root (the site at the repository root is a separate project).

# pnpm refuses to run a dependency's install scripts unless it is listed here. electron-winstaller
# picks its 7-Zip; Electron's own binary is fetched by this package's postinstall. node-hid ships
# prebuilt for every platform, and its script only checks for them (or compiles), so it's skipped.
allowBuilds:
  electron-winstaller: true
  node-hid: false
