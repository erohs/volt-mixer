<!doctype html>
<!--
    The 1200×630 link-preview card, in the page's dark tokens. tools/make-images.mjs screenshots
    it to public/og-image.png. ?icon=<size> renders the app icon on an opaque square instead.
-->
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Volt Mixer card</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
            }

            body {
                inline-size: 1200px;
                block-size: 630px;
                overflow: hidden;
                background: #171615;
                color: #eeece8;
                font-family: "Segoe UI", system-ui, sans-serif;
            }

            .card {
                display: grid;
                grid-template-columns: 1fr 380px;
                align-items: center;
                gap: 64px;
                block-size: 100%;
                padding: 72px 80px;
            }

            h1 {
                font-size: 76px;
                font-weight: 600;
                letter-spacing: -0.02em;
            }

            .tagline {
                margin-block-start: 20px;
                color: #eeece8;
                font-size: 34px;
                line-height: 1.3;
                text-wrap: balance;
            }

            .facts {
                margin-block-start: 36px;
                color: #aca7a0;
                font-size: 22px;
                text-wrap: balance;
            }

            .accent {
                color: #b79cff;
            }

            .desk {
                display: flex;
                justify-content: space-between;
                padding: 32px;
                border: 1px solid #302e2b;
                border-radius: 20px;
                background: #201f1d;
            }

            .strip {
                display: grid;
                justify-items: center;
                gap: 14px;
                color: #aca7a0;
                font-size: 18px;
            }

            .rails {
                display: flex;
                gap: 8px;
                block-size: 300px;
            }

            .fader {
                position: relative;
                inline-size: 8px;
                border-radius: 4px;
                background: #383633;
            }

            .fill {
                position: absolute;
                inset-block-end: 0;
                inline-size: 100%;
                border-radius: 4px;
                background: var(--colour);
            }

            .thumb {
                position: absolute;
                inset-inline-start: -10px;
                inline-size: 28px;
                block-size: 28px;
                border-radius: 50%;
                background: var(--colour);
                translate: 0 50%;
            }

            .meter {
                position: relative;
                inline-size: 10px;
                border-radius: 3px;
                background: #383633;
            }

            .meter .fill {
                background: #5fd38d;
            }

            .icon {
                display: none;
            }

            /* Opaque, in the icon's own colour: iOS fills transparent corners with black. */
            body.is-icon {
                inline-size: auto;
                block-size: auto;
                background: #1e1e21;
            }

            .is-icon .card {
                display: none;
            }

            .is-icon .icon {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div>
                <h1>Volt <span class="accent">Mixer</span></h1>
                <p class="tagline">Control a UA Volt 4 Gen 2's built-in mixer from your browser. No UAD Console.</p>
                <p class="facts">Free and open source · Edge and Chrome · nothing to install</p>
            </div>
            <div class="desk" aria-hidden="true" data-desk></div>
        </div>
        <img class="icon" src="../public/icon.svg" alt="" data-icon />
        <script>
            const size = Number(new URLSearchParams(location.search).get("icon"));
            if (size > 0) {
                document.body.classList.add("is-icon");
                Object.assign(document.querySelector("[data-icon]"), { width: size, height: size });
            }

            /* ?glyph=<size>: the icon's three faders in black on transparent, for the macOS menu bar. */
            const glyph = Number(new URLSearchParams(location.search).get("glyph"));
            if (glyph > 0) {
                document.body.className = "is-icon";
                document.body.style.background = "transparent";
                document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 56 52" width="${glyph}" height="${glyph}">
                    <g stroke="#000" stroke-width="4" stroke-linecap="round" opacity="0.45">
                        <line x1="18" y1="14" x2="18" y2="50"/><line x1="32" y1="14" x2="32" y2="50"/><line x1="46" y1="14" x2="46" y2="50"/>
                    </g>
                    <g fill="#000">
                        <rect x="11" y="32" width="14" height="7" rx="2"/><rect x="25" y="20" width="14" height="7" rx="2"/><rect x="39" y="38" width="14" height="7" rx="2"/>
                    </g>
                </svg>`;
            }

            /* Four strips like the page's: name, fader in its tone colour, a meter beside it. */
            const strips = [
                ["Input 1", "#ffb547", 0.62, 0.48],
                ["Input 2", "#b79cff", 0.5, 0.2],
                ["Line 3/4", "#b79cff", 0.7, 0.66],
                ["Loopback", "#b79cff", 0.44, 0.35],
            ];
            const desk = document.querySelector("[data-desk]");
            for (const [name, colour, level, meter] of strips) {
                desk.insertAdjacentHTML(
                    "beforeend",
                    `<div class="strip" style="--colour: ${colour}">
                        <div class="rails">
                            <div class="fader">
                                <div class="fill" style="block-size: ${level * 100}%"></div>
                                <div class="thumb" style="inset-block-end: ${level * 100}%"></div>
                            </div>
                            <div class="meter"><div class="fill" style="block-size: ${meter * 100}%"></div></div>
                        </div>
                        <span>${name}</span>
                    </div>`,
                );
            }
        </script>
    </body>
</html>
